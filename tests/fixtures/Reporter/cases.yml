# eq = version keep
# gt = version upgrade
# lt = version downgrade
# ---
# platform = p
# api      = a
# package  = c
# peer     = e
# ---
# required   optional     rr oo ro or rn on nr no
# production development  pp dd pd dp pn dn np nd
# direct     child        dd cc dc cd dn cn nc nd
# ---
# null = n = left or the right side is missing (added or removed package)
